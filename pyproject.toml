[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qtpy6"
dynamic = ["version"]
description = "PySide6's API, in snake_case, on top of PySide6 or PyQt6"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
authors = [{name = "smartaudiotools"}]
keywords = ["qt", "qt6", "pyside6", "pyqt6", "snake_case", "abstraction layer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]

[project.optional-dependencies]
pyside6 = ["PySide6>=6.4"]
pyqt6 = ["PyQt6>=6.4"]
test = ["pytest", "pytest-cov"]

[project.scripts]
qtselector = "qtpy6.QtSelector:main"

[tool.setuptools]
packages = ["qtpy6"]

[tool.setuptools.dynamic]
version = {attr = "qtpy6.__version__"}

[tool.setuptools.package-data]
qtpy6 = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
