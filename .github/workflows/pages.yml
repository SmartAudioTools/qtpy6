# Publie le site de qtpy6 sur GitHub Pages (https://smartaudiotools.github.io/qtpy6/) : la page de lancement d'un script
# quelconque et Pyodide-Qt (pyodide-qt/), que hebergement/construire_site.py assemble. Le binaire n'est jamais dans le
# dépôt, hebergement/telecharger.sh le rapporte de la release épinglée dans qtpy6/web/versions.json (empreinte vérifiée).
# Ne tourne que si l'un de ces fichiers change (qtpy6/ : le site en sert une copie, qtpy6.zip), ou à la main. Le site Pages doit exister AVANT (web.md, « Hébergement ») :
# le jeton de l'action ne peut pas le créer (« enablement: true » de configure-pages échoue en « Resource not accessible
# by integration », mesuré le 26/09/2026), et sans lui configure-pages s'arrête sur « Get Pages site failed ».
name: Pages
on:
  push:
    branches: [master]
    paths: [hebergement/**, qtpy6/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: hebergement/telecharger.sh
      - run: python3 hebergement/construire_site.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
